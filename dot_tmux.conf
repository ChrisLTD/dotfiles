# Use https://learnxinyminutes.com/docs/tmux/ as a reference
# Modified from https://github.com/ThePrimeagen/.dotfiles/blob/master/tmux/.tmux.conf

# Enable true-color support inside tmux so modern themes render correctly.
set -ga terminal-overrides ",screen-256color*:Tc"

# Tell tmux to advertise itself as a 256-color terminal.
# This is a common, safe default for terminal apps like Neovim.
set-option -g default-terminal "screen-256color"

# Remove the delay tmux normally waits after Escape.
# This makes Vim/Neovim feel more responsive inside tmux.
set -s escape-time 0


# Remove tmux's default prefix key: Ctrl-b.
unbind C-b

# Set the tmux prefix key to Ctrl-a instead.
# After this, tmux commands start with Ctrl-a.
set-option -g prefix C-a

# Let Ctrl-a Ctrl-a send a literal Ctrl-a through to the program running inside tmux.
# Useful for nested tmux sessions or programs that use Ctrl-a themselves.
bind-key C-a send-prefix

# Set the status bar colors.
# bg = background color, fg = foreground/text color.
set -g status-style 'bg=#333333 fg=#5eacd3'


# Reload the tmux config with: prefix + r
# After editing ~/.tmux.conf, this saves you from restarting tmux.
bind r source-file ~/.tmux.conf

# Start window numbering at 1 instead of 0.
# Many people find this more natural.
set -g base-index 1

# Set scrollback history limit to higher than the default
set -g history-limit 10000

# Use Vim-style keybindings in copy mode.
# This gives you familiar movement behavior while scrolling/selecting text.
set-window-option -g mode-keys vi

# In copy-mode-vi, press "v" to begin a selection,
# similar to entering visual mode in Vim.
bind -T copy-mode-vi v send-keys -X begin-selection

# In copy-mode-vi, press "y" to copy the selection to the macOS clipboard
# and then exit copy mode.
# Swapped from xclip (Linux) to pbcopy (macOS).
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'


# Vim-like pane switching
# prefix + ^ jumps back to the previously active window.
bind -r ^ last-window

# prefix + k selects the pane above.
bind -r k select-pane -U

# prefix + j selects the pane below.
bind -r j select-pane -D

# prefix + h selects the pane to the left.
bind -r h select-pane -L

# prefix + l selects the pane to the right.
bind -r l select-pane -R

# Enable Mouse
# set-option -g mouse on
bind m set -g mouse \; display "Mouse: #{?mouse,on,off}"

# prefix + D opens a new tmux window in the current pane's working directory.
# If a local TODO.md exists there, open it in Neovim.
# Otherwise, open your fallback personal todo file.
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

